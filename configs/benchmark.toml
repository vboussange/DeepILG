[project]
# Human-readable run name and ignored destination for generated files.
name = "wade2025-population-holdout"
output_dir = "outputs/benchmark"

[data]
# Public genetic matrices and the fixed population-holdout assignment.
fst_dir = "data/wade2025/fst"
# Exact authorized WGS84 locations must be supplied at this ignored path.
coordinates = "data/private/wade2025/coordinates.csv"
folds = "data/wade2025/folds.csv"
# Downloaded products and processed tensors are local, generated data.
cache_dir = "cache/benchmark"
processed_dir = "outputs/benchmark/processed"
# The empirical workflow is eligible for scientific export after validation.
geolocation_status = "empirical"
scientific_use = true

[preprocessing]
# Align covariates at 30 m and map each 32x32-pixel patch to one graph vertex.
resolution_m = 30
patch_size = 32
# Approximate road length per area within a 300 m neighbourhood.
road_radius_m = 300

[training]
# One deterministic neural fit is defined for each architecture and population-holdout fold.
seed = 17
# Select the best validation checkpoint, stopping after 50 stale epochs.
epochs = 500
patience = 50
# Architecture-specific initial learning rates used in the manuscript benchmark.
resnet9_learning_rate = 0.0001
unet_learning_rate = 0.001
# After 20 stale epochs, halve the learning rate and restart AdamW's moments, with a 1e-6 floor.
lr_patience = 20
lr_factor = 0.5
min_learning_rate = 0.000001
# AdamW regularization shared by both neural architectures.
weight_decay = 0.0001
# Omit to encode each full region without ResNet9 activation checkpointing.
# Uncomment to checkpoint ResNet9 chunks (also when all patches fit in one chunk).
# U-Net only chunks its initial linear embedding; see README for memory semantics.
# patch_batch_size = 32

[solver]
# Conjugate-gradient tolerances and iteration cap for grounded Laplacian systems.
rtol = 1e-6
atol = 1e-6
max_steps = 1000
# Reuse an AMJax hierarchy to reduce iteration count and memory pressure.
use_amg = true
